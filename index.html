<!DOCTYPE html>
<html lang="ja" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumière Skin - Private Beauty Salon</title>
    <meta name="description" content="もう、脱毛で迷わない。大人のための、美肌・オーダーメイド脱毛サロン「Lumière Skin」。" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500&family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              mincho: ['"Shippori Mincho"', 'serif'],
              sans: ['"Noto Sans JP"', 'sans-serif'],
              serif: ['"Cormorant Garamond"', 'serif'],
            },
            colors: {
              base: '#F9F8F6',
              main: '#D8C6C6', // Dusty Pink
              accent: '#BFA588', // Copper Gold
              text: '#4A4A4A', // Dark Brown/Charcoal
              'text-light': '#525252', // Darkened for better readability
              sand: '#E6DDD3',
            },
            letterSpacing: {
              'widest': '0.1em',
              'relaxed': '0.05em',
            },
            animation: {
              'fade-in': 'fadeIn 1.5s ease-out forwards',
              'fade-in-up': 'fadeInUp 1.2s ease-out forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Noto Sans JP', sans-serif;
        background-color: #F9F8F6;
        color: #4A4A4A;
        letter-spacing: 0.05em;
      }
      /* Noise Texture Overlay */
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 9999;
      }
      h1, h2, h3, .font-heading {
        font-family: 'Shippori Mincho', serif;
      }
      .font-eng {
        font-family: 'Cormorant Garamond', serif;
      }
      
      /* Vertical Writing */
      .vertical-text {
        writing-mode: vertical-rl;
        text-orientation: upright;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #F9F8F6; 
      }
      ::-webkit-scrollbar-thumb {
        background: #D8C6C6; 
        border-radius: 3px;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.39.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0"
  }
}
</script>
</head>
  <body class="bg-base text-text antialiased selection:bg-main selection:text-white">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
